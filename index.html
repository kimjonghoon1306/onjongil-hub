<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>온종일 — 블로그 · 애드센스 · 부업 스터디</title>
  <meta name="description" content="온종일 스터디 그룹 자동화 툴 허브" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 관리자 바 -->
  <div id="adminBar" class="admin-bar hidden">
    <span>⚙️ 관리자 모드 활성화</span>
    <button onclick="exitAdmin()">나가기 ✕</button>
  </div>

  <!-- 히어로 -->
  <header class="hero">
    <div class="hero-inner">
      <div class="logo-box">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 32 L12 24 L19 27 L27 16 L35 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="24" r="3" fill="white"/>
          <circle cx="19" cy="27" r="3" fill="white"/>
          <circle cx="27" cy="16" r="3" fill="white"/>
          <text x="6" y="13" fill="rgba(255,255,255,0.55)" font-size="10" font-family="sans-serif">+</text>
          <text x="28" y="9" fill="rgba(255,255,255,0.55)" font-size="10" font-family="sans-serif">+</text>
        </svg>
      </div>
      <div class="hero-text">
        <h1>온종일</h1>
        <p>블로그 · 애드센스 · 부업 스터디</p>
      </div>
    </div>
    <div class="tags">
      <span class="tag naver">네이버</span>
      <span class="tag adpost">애드포스트</span>
      <span class="tag adsense">애드센스</span>
      <span class="tag side">부업</span>
    </div>
  </header>

  <!-- 툴 섹션 -->
  <main>
    <div class="section-header">
      <span class="section-title">🔧 자동화 툴 모음</span>
      <span class="tool-count" id="toolCount"></span>
    </div>
    <div class="grid" id="toolGrid"></div>
  </main>

  <!-- FAB -->
  <button class="fab" onclick="onFabClick()" title="관리자">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- 비밀번호 오버레이 -->
  <div class="overlay hidden" id="pwOverlay" onclick="closeOverlay(event,'pwOverlay')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">🔐 관리자 로그인</h2>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="pwInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')checkPw()" />
      </div>
      <p id="pwErr" class="err-msg hidden">비밀번호가 틀렸습니다</p>
      <div class="btn-row">
        <button class="btn btn-cancel" onclick="closeOverlayById('pwOverlay')">취소</button>
        <button class="btn btn-primary" onclick="checkPw()">확인</button>
      </div>
    </div>
  </div>

  <!-- 편집 오버레이 -->
  <div class="overlay hidden" id="editOverlay" onclick="closeOverlay(event,'editOverlay')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="editTitle">툴 추가</h2>
      <div class="field">
        <label>툴 이름 *</label>
        <input type="text" id="fName" placeholder="예: BlogAuto Pro" />
      </div>
      <div class="field">
        <label>URL *</label>
        <input type="url" id="fUrl" placeholder="https://example.com" />
      </div>
      <div class="field">
        <label>설명</label>
        <input type="text" id="fDesc" placeholder="간단한 한 줄 설명" />
      </div>
      <div class="field">
        <label>카테고리</label>
        <select id="fCat">
          <option value="naver">네이버</option>
          <option value="adpost">애드포스트</option>
          <option value="adsense">애드센스</option>
          <option value="side">부업</option>
          <option value="etc">기타</option>
        </select>
      </div>
      <div class="field">
        <label>아이콘 (이모지 1개)</label>
        <input type="text" id="fIcon" placeholder="📝" maxlength="2" />
      </div>
      <div class="field">
        <label>카드 색상</label>
        <div class="color-pick" id="colorPick"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-cancel" onclick="closeOverlayById('editOverlay')">취소</button>
        <button class="btn btn-primary" onclick="saveCard()">저장</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
